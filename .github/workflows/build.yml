name: Build

# Проверочная сборка для веток (кроме main): без релиза, просто «компилируется ли»
on:
  push:
    branches: [ dev, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Сборка
        run: dotnet build InteractiveMenu.csproj -c Release --nologo
